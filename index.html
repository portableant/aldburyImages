<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Directus Image</title>
    <style>
        /* CSS for full-screen background image */
        body {
            margin: 0;
            padding: 0;
            /* Hide overflow to prevent scrollbars */
            overflow: hidden; 
            background-color: #1a1a1a; /* Dark background while image loads */
        }

        #fullscreen-image {
            /* Full viewport size */
            width: 100vw;
            height: 100vh;
            /* Center the image */
            display: block;
            margin: 0 auto;
            /* Ensure the image covers the entire screen without distortion */
            object-fit: cover;
            /* Animation for a smoother transition */
            transition: opacity 0.5s ease-in-out;
            opacity: 0; /* Start hidden */
        }

        /* Loading state message */
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: sans-serif;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <p id="loading-message">Loading random image from Directus...</p>
    <img id="fullscreen-image" src="" alt="A random image from the Directus API">

    <script>
        // --- CONFIGURATION ---
        const DIRECTUS_URL = 'https://directus.museologi.st'; // Replace with your Directus instance URL (e.g., https://my.directus.app)
        const COLLECTION_NAME = 'aldburyImages'; // Replace with the name of your collection containing images (e.g., 'images', 'posts')
        // Assuming your image field is named 'image_file'
        const IMAGE_FIELD_NAME = 'image'; 
        const AUTH_TOKEN = ''; // Optional: Add your Directus API token here if needed for private collections
        // ---------------------


        const imageElement = document.getElementById('fullscreen-image');
        const loadingMessage = document.getElementById('loading-message');
        const RANDOM_POOL_SIZE = 100;
       /**
 * Fetches a limited number of items from a Directus collection (sorted by date)
 * and then selects one item at random using client-side Math.
 * * @returns {Promise<Object | null>} The randomly selected item object, or null on failure.
 */
async function getRandomItemFromCollection() {
    
    // 1. Construct the API URL to fetch a limited subset of items.
    // Sorting by '-date_created' (newest first) ensures a stable list for the pool.
    const url = `${DIRECTUS_URL}/items/${COLLECTION_NAME}?limit=${RANDOM_POOL_SIZE}&sort=-created`;

    try {
        // 2. Execute the GET request to the Directus API.
        const response = await fetch(url, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${AUTH_TOKEN}`
            }
        });

        // Handle HTTP errors (e.g., 401, 403, 404)
        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(`API Error: ${response.status} - ${errorData.errors[0]?.message || response.statusText}`);
        }

        const data = await response.json();
        const items = data.data;

        if (!items || items.length === 0) {
            console.warn(`The collection "${COLLECTION_NAME}" is empty or no items were returned.`);
            return null;
        }

        // 3. Client-Side Randomization Logic
        const listSize = items.length;
        
        // Generate a random integer index between 0 (inclusive) and listSize (exclusive)
        // This index points to a random item in the fetched array.
        const randomIndex = Math.floor(Math.random() * listSize);

        // 4. Select and Return the Item
        const randomItem = items[randomIndex];

        console.log("-----------------------------------------");
        console.log(`✅ Success: Fetched ${listSize} items.`);
        console.log(`✅ Selected item at array index: ${randomIndex}`);
        console.log("-----------------------------------------");
        
        return randomItem;

    } catch (error) {
        console.error("❌ Failed to complete random item selection:", error.message);
        return null;
    }
}

// --- EXECUTION ---
getRandomItemFromCollection()
    .then(item => {
        if (item) {
            console.log("\n--- Randomly Selected Item Data ---");
            console.log(item);
            
            // Example of accessing specific fields:
            // console.log(`Item ID: ${item.id}`);
            // console.log(`Item Title: ${item.title}`); 
        } else {
            console.log("No item could be randomly selected.");
        }
    });

    </script>

</body>
</html>
