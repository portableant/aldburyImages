<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Directus Image</title>
    <style>
        /* CSS for full-screen background image */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide overflow to prevent scrollbars */
            background-color: #1a1a1a; /* Dark background while image loads */
        }

        #fullscreen-image {
            /* Full viewport size */
            width: 100vw;
            height: 100vh;
            /* Center the image */
            display: block;
            margin: 0 auto;
            /* Ensure the image covers the entire screen without distortion */
            object-fit: cover;
            /* Animation for a smoother transition */
            transition: opacity 0.5s ease-in-out;
            opacity: 0; /* Start hidden */
        }

        /* Loading state message */
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: sans-serif;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <p id="loading-message">Loading random image from Directus...</p>
    <img id="fullscreen-image" src="" alt="A random image from the Directus API">

    <script>
        // --- CONFIGURATION ---
        // 1. Directus URL (Must be the base URL)
        const DIRECTUS_URL = 'https://directus.museologi.st'; 
        // 2. Name of your collection containing images
        const COLLECTION_NAME = 'aldburyImages'; 
        // 3. The name of the field in that collection that holds the File ID (often named 'image' or 'file')
        const IMAGE_FIELD_NAME = 'image'; 
        // 4. Optional: API Token (only needed for private collections)
        const AUTH_TOKEN = ''; 
        // 5. How many items to fetch for the random pool (client-side randomness)
        const RANDOM_POOL_SIZE = 100;
        // ---------------------


        const imageElement = document.getElementById('fullscreen-image');
        const loadingMessage = document.getElementById('loading-message');

        /**
         * Fetches a limited number of items from a Directus collection (sorted by date)
         * and then selects one item at random using client-side Math.
         * @returns {Promise<Object | null>} The randomly selected item object, or null on failure.
         */
        async function getRandomItemFromCollection() {
            // Include the IMAGE_FIELD_NAME in the fields parameter to ensure it's returned
            const url = `${DIRECTUS_URL}/items/${COLLECTION_NAME}?limit=${RANDOM_POOL_SIZE}&sort=-created&fields=${IMAGE_FIELD_NAME}`;

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        // Only include Authorization header if a token is provided
                        ...(AUTH_TOKEN && { 'Authorization': `Bearer ${AUTH_TOKEN}` })
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error: ${response.status} - ${errorData.errors[0]?.message || response.statusText}`);
                }

                const data = await response.json();
                const items = data.data;

                if (!items || items.length === 0) {
                    throw new Error(`The collection "${COLLECTION_NAME}" is empty or no items were returned.`);
                }

                // Client-Side Randomization Logic
                const listSize = items.length;
                const randomIndex = Math.floor(Math.random() * listSize);
                const randomItem = items[randomIndex];
                
                return randomItem;

            } catch (error) {
                console.error("❌ Failed to complete random item selection:", error.message);
                // Hide loading message and show a user-friendly error
                loadingMessage.textContent = `Error: ${error.message}`;
                return null;
            }
        }


        // --- EXECUTION ---
        getRandomItemFromCollection()
            .then(item => {
                if (item) {
                    // 1. Get the File ID from the random item
                    const fileId = item[IMAGE_FIELD_NAME];

                    if (!fileId) {
                        console.error(`❌ Field '${IMAGE_FIELD_NAME}' is missing or null in the selected item.`);
                        loadingMessage.textContent = `Error: Image field not found on item.`;
                        return;
                    }

                    // 2. Construct the Directus File Endpoint URL
                    // Directus file endpoint: [DIRECTUS_URL]/assets/[FILE_ID]
                    const imageUrl = `${DIRECTUS_URL}/assets/${fileId}`;
                    
                    // You can add an optional image processing parameter here, e.g., to resize it to fill the screen:
                    // const imageUrl = `${DIRECTUS_URL}/assets/${fileId}?width=${window.innerWidth}&height=${window.innerHeight}&quality=80&fit=cover`;

                    // 3. Assign the URL to the image element
                    imageElement.src = imageUrl;

                    // 4. Set up an event listener to hide the loading message and fade the image in once it loads
                    imageElement.onload = () => {
                        loadingMessage.style.display = 'none';
                        imageElement.style.opacity = 1;
                    };
                    
                    // 5. Handle image loading errors
                    imageElement.onerror = () => {
                        loadingMessage.textContent = "Error: Failed to load image from Directus.";
                    };
                    
                }
            });

    </script>

</body>
</html>
